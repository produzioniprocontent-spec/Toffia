<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Notifiche Toffia</title>

    <!-- 1. SCRIPT SDK ONESIGNAL (Il tuo ID è già inserito) -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
        window.OneSignalDeferred = window.OneSignalDeferred || [];
        OneSignalDeferred.push(async function(OneSignal) {
            await OneSignal.init({
                appId: "bb1e9ba5-eee7-4d95-b674-c3c670842374",
                safari_web_id: "web.onesignal.auto.19a42a42-bb44-4f4d-b94d-16a707963d41", // Aggiungi se necessario per Safari
                notifyButton: {
                    enable: false, // Disabilitiamo il pulsante predefinito
                },
            });

            // Controlla lo stato iniziale dell'iscrizione al caricamento
            checkSubscriptionStatus();
        });
    </script>

    <!-- 2. STILI CSS (Design Ergonomico) -->
    <style>
        :root {
            --primary-color: #007bff;
            --danger-color: #dc3545;
            --success-color: #28a745;
            --bg-color: #f4f7f6;
            --text-color: #333;
            --border-radius: 20px; /* Bordi molto stondati */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .notification-box {
            background-color: #fff;
            padding: 40px;
            border-radius: var(--border-radius);
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); /* Ombretta morbida e profonda */
            width: 100%;
            max-width: 450px;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .notification-box:hover {
            transform: translateY(-5px); /* Effetto hover leggero */
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        p.description {
            color: #666;
            margin-bottom: 30px;
            font-size: 15px;
        }

        /* Stili per i selettori a slide (Switch) */
        .switch-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            text-align: left;
        }

        .switch-label {
            font-weight: 600;
            font-size: 16px;
        }

        .switch-description {
            display: block;
            font-weight: normal;
            font-size: 13px;
            color: #888;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--success-color);
        }

        input:focus + .slider {
            box-shadow: 0 0 1px var(--success-color);
        }

        input:checked + .slider:before {
            transform: translateX(24px);
        }

        /* Stili per i pulsanti */
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 50px; /* Pulsanti a pillola */
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
            margin-top: 15px;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: #0056b3;
        }

        .btn-danger {
            background-color: transparent;
            color: var(--danger-color);
            border: 2px solid var(--danger-color);
            margin-top: 25px;
        }

        .btn-danger:hover {
            background-color: #fff5f5;
        }

        .btn:disabled {
            background-color: #ccc;
            border-color: #ccc;
            color: #666;
            cursor: not-allowed;
        }

        /* Messaggio di stato */
        #status-message {
            margin-top: 20px;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="notification-box">
        <h1>Centro Notifiche Toffia</h1>
        <p class="description">Rimani aggiornato sulle novità che ti interessano. Gestisci le tue preferenze qui sotto.</p>

        <!-- Selettori Slide -->
        <div class="switch-container">
            <span class="switch-label">
                Istituzionali e Servizio
                <span class="switch-description">Comunicazioni ufficiali e avvisi di servizio.</span>
            </span>
            <label class="switch">
                <input type="checkbox" id="slide-istituzionali">
                <span class="slider"></span>
            </label>
        </div>

        <div class="switch-container">
            <span class="switch-label">
                Eventi e Cultura
                <span class="switch-description">Notizie su eventi, mostre e iniziative locali.</span>
            </span>
            <label class="switch">
                <input type="checkbox" id="slide-eventi">
                <span class="slider"></span>
            </label>
        </div>

        <!-- Pulsanti Principali -->
        <button id="btn-accetta-tutto" class="btn btn-primary">✅ Accetta Tutto</button>
        <button id="btn-salva-preferenze" class="btn btn-success" style="display:none; background-color: var(--success-color); color: white;">Salva Preferenze</button>
        <button id="btn-disiscriviti" class="btn btn-danger">Disiscriviti dalle Notifiche</button>

        <p id="status-message"></p>
    </div>

    <!-- 3. LOGICA JAVASCRIPT -->
    <script>
        // Riferimenti agli elementi DOM
        const slideIstituzionali = document.getElementById('slide-istituzionali');
        const slideEventi = document.getElementById('slide-eventi');
        const btnAccettaTutto = document.getElementById('btn-accetta-tutto');
        const btnSalvaPreferenze = document.getElementById('btn-salva-preferenze');
        const btnDisiscriviti = document.getElementById('btn-disiscriviti');
        const statusMessage = document.getElementById('status-message');

        // Funzione per mostrare messaggi di stato
        function showStatus(message, type = 'info') {
            statusMessage.textContent = message;
            statusMessage.style.color = type === 'error' ? 'var(--danger-color)' : (type === 'success' ? 'var(--success-color)' : 'var(--text-color)');
        }

        // Funzione per controllare e aggiornare l'interfaccia in base all'iscrizione OneSignal
        async function checkSubscriptionStatus() {
            OneSignalDeferred.push(async function(OneSignal) {
                const isSubscribed = await OneSignal.User.PushSubscription.id;
                
                if (isSubscribed) {
                    btnAccettaTutto.style.display = 'none';
                    btnSalvaPreferenze.style.display = 'block';
                    btnDisiscriviti.disabled = false;
                    
                    // Recupera i tag esistenti per impostare gli slide
                    const tags = await OneSignal.User.getTags();
                    if (tags) {
                        slideIstituzionali.checked = tags['istituzionali'] === 'true';
                        slideEventi.checked = tags['eventi'] === 'true';
                    }
                    showStatus('Sei iscritto alle notifiche.', 'success');
                } else {
                    btnAccettaTutto.style.display = 'block';
                    btnSalvaPreferenze.style.display = 'none';
                    btnDisiscriviti.disabled = true;
                    // Reset slide
                    slideIstituzionali.checked = false;
                    slideEventi.checked = false;
                    showStatus('Non sei ancora iscritto.');
                }
            });
        }

        // --- Gestione Eventi ---

        // 1. Pulsante "Accetta Tutto"
        btnAccettaTutto.addEventListener('click', () => {
            // Logica Visiva
            slideIstituzionali.checked = true;
            slideEventi.checked = true;

            // Logica OneSignal: Iscrizione + Invio Tag
            OneSignalDeferred.push(async function(OneSignal) {
                try {
                    await OneSignal.Slidedown.promptPush(); // Mostra il prompt nativo del browser
                    // Nota: L'invio dei tag dovrebbe avvenire dopo che l'utente ha accettato nel prompt nativo.
                    // OneSignal gestisce l'iscrizione. I tag verranno inviati al successivo salvataggio o se gestisci l'evento di iscrizione.
                    // Per semplicità qui simuliamo l'invio dei tag "tutto" dopo il prompt.
                    await OneSignal.User.addTags({
                        istituzionali: 'true',
                        eventi: 'true'
                    });
                    checkSubscriptionStatus(); // Aggiorna l'interfaccia
                } catch (error) {
                    console.error("Errore durante l'iscrizione:", error);
                    showStatus('Si è verificato un errore durante l\'iscrizione.', 'error');
                }
            });
        });

        // 2. Pulsante "Salva Preferenze" (visibile solo se già iscritto)
        btnSalvaPreferenze.addEventListener('click', () => {
            const tags = {
                istituzionali: slideIstituzionali.checked.toString(),
                eventi: slideEventi.checked.toString()
            };

            OneSignalDeferred.push(async function(OneSignal) {
                await OneSignal.User.addTags(tags);
                showStatus('Preferenze salvate con successo!', 'success');
                // Nascondi il messaggio dopo qualche secondo
                setTimeout(() => showStatus('Sei iscritto alle notifiche.', 'success'), 3000);
            });
        });

        // 3. Pulsante "Disiscriviti"
        btnDisiscriviti.addEventListener('click', () => {
            // Logica Visiva
            slideIstituzionali.checked = false;
            slideEventi.checked = false;

            // Logica OneSignal: Disiscrizione
            OneSignalDeferred.push(async function(OneSignal) {
                try {
                    await OneSignal.User.PushSubscription.optOut();
                    // Opzionalmente rimuovi i tag
                    await OneSignal.User.removeTags(['istituzionali', 'eventi']);
                    checkSubscriptionStatus(); // Aggiorna l'interfaccia
                    showStatus('Ti sei disiscritto correttamente.');
                } catch (error) {
                    console.error("Errore durante la disiscrizione:", error);
                    showStatus('Si è verificato un errore durante la disiscrizione.', 'error');
                }
            });
        });
    </script>
</body>
</html>
