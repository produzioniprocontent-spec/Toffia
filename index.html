<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comune di Toffia - Centro Notifiche</title>

  <!-- SDK OneSignal v16 -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      try {
        await OneSignal.init({
          appId: "9ec5caf0-eac5-4869-8fd4-85277997218f",
          promptOptions: {
            slidedown: {
              prompts: [
                {
                  type: "push",
                  autoPrompt: false // impedisce lo slidedown automatico di OneSignal
                }
              ]
            }
          }
        });

        // Inizializza lo stato del pulsante
        await updateSubscriptionStatus(OneSignal);

        // Listener sui cambiamenti di iscrizione OneSignal
        OneSignal.User.PushSubscription.addEventListener("change", function() {
          updateSubscriptionStatus(OneSignal);
        });

        // Listener sui cambiamenti di permesso (più affidabile dopo il prompt nativo)
        OneSignal.Notifications.addEventListener("permissionChange", function() {
          updateSubscriptionStatus(OneSignal);
        });

        // Listener sui permessi nativi del browser (fallback)
        if (navigator.permissions) {
          const permissionStatus = await navigator.permissions.query({ name: 'notifications' });
          permissionStatus.onchange = function() {
            updateSubscriptionStatus(OneSignal);
          };
        }

      } catch (error) {
        console.error("Errore di inizializzazione OneSignal:", error);
        document.getElementById("status-text").textContent = "Errore durante il caricamento.";
      }
    });

    async function updateSubscriptionStatus(OneSignal) {
      const btn = document.getElementById("prompt-button");
      const statusText = document.getElementById("status-text");

      if (!OneSignal.Notifications.isPushSupported()) {
        statusText.textContent = "Le notifiche push non sono supportate da questo browser.";
        btn.style.display = "none";
        return;
      }

      const permission = Notification.permission;
      const isOptedIn = OneSignal.User.PushSubscription.optedIn;

      if (permission === "denied") {
        statusText.textContent = "Notifiche bloccate nel browser. Abilitale nelle impostazioni del sito.";
        statusText.style.color = "#d9534f";
        btn.textContent = "Notifiche Bloccate";
        btn.disabled = true;
        btn.onclick = null;
        return;
      }

      statusText.style.color = "#333";
      btn.disabled = false;

      if (isOptedIn) {
        statusText.textContent = "Stato attuale: Iscritto alle notifiche";
        btn.textContent = "Disattiva Notifiche";
        btn.onclick = async () => {
          await OneSignal.User.PushSubscription.optOut();
          updateSubscriptionStatus(OneSignal);
        };
      } else {
        statusText.textContent = "Stato attuale: Non iscritto";
        btn.textContent = "Attiva Notifiche";

        // Cliccando sul pulsante si innesca la richiesta nativa del browser
        btn.onclick = async () => {
          try {
            if (Notification.permission === "granted" && OneSignal.User.PushSubscription.id) {
              // Già autorizzato ma disiscritto: basta l'opt-in
              await OneSignal.User.PushSubscription.optIn();
            } else {
              // Browser mai registrato: mostra il prompt nativo
              await OneSignal.Notifications.requestPermission();
            }
          } catch (e) {
            console.log("Richiesta permesso fallita o annullata dall'utente:", e);
          }
          updateSubscriptionStatus(OneSignal);
        };
      }
    }
  </script>

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f4f4f9;
    }
    .card {
      background: white;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      max-width: 420px;
      text-align: center;
    }
    .header-title {
      font-size: 1.6rem;
      font-weight: 700;
      color: #1a1a1a;
      margin: 0;
    }
    .header-subtitle {
      font-size: 1.2rem;
      font-weight: 500;
      color: #4a5568;
      margin: 0.25rem 0 0 0;
    }
    .header-number {
      font-size: 2.5rem;
      font-weight: 800;
      color: #e54b4d;
      margin: 0.5rem 0 1.5rem 0;
    }
    p {
      color: #666;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .status {
      margin: 1.5rem 0;
      font-weight: 600;
      color: #333;
    }
    button {
      background-color: #e54b4d;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    button:hover:not(:disabled) {
      background-color: #c93b3d;
    }
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header-title">Comune di Toffia</div>
    <div class="header-subtitle">Centro Notifiche</div>
    <div class="header-number">04</div>

    <p>Gestisci le tue preferenze per la ricezione delle comunicazioni istituzionali in tempo reale.</p>

    <div id="status-text" class="status">Verifica stato...</div>

    <button id="prompt-button">Caricamento...</button>
  </div>

</body>
</html>
