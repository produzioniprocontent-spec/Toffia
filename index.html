<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comune di Toffia - Centro Notifiche</title>
  
  <!-- SDK OneSignal v16 -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      try {
        await OneSignal.init({
          appId: "9ec5caf0-eac5-4869-8fd4-85277997218f",
          slidedown: {
            prompts: [
              {
                type: "push",
                actionMessage: "Vorremmo inviarti notifiche per gli aggiornamenti importanti.",
                acceptButtonBody: "Consenti",
                cancelButtonBody: "No grazie"
              }
            ]
          }
        });

        // Forza l'aggiornamento dello stato iniziale
        await updateSubscriptionStatus(OneSignal);

        // Ascolta i cambiamenti di stato dell'iscrizione
        OneSignal.User.PushSubscription.addEventListener("change", function() {
          updateSubscriptionStatus(OneSignal);
        });

      } catch (error) {
        console.error("Errore durante l'inizializzazione di OneSignal:", error);
        document.getElementById("status-text").textContent = "Errore di caricamento o HTTPS non attivo";
        document.getElementById("prompt-button").textContent = "Errore";
      }
    });

    async function updateSubscriptionStatus(OneSignal) {
      const btn = document.getElementById("prompt-button");
      const statusText = document.getElementById("status-text");

      // Verifichiamo se il browser supporta le notifiche push
      if (!OneSignal.Notifications.isPushSupported()) {
        statusText.textContent = "Le notifiche push non sono supportate su questo browser.";
        btn.style.display = "none";
        return;
      }

      // Otteniamo lo stato attuale di iscrizione
      const isOptedIn = OneSignal.User.PushSubscription.optedIn;

      if (isOptedIn) {
        statusText.textContent = "Stato attuale: Iscritto alle notifiche";
        btn.textContent = "Disattiva Notifiche";
        btn.onclick = async () => {
          await OneSignal.User.PushSubscription.optOut();
          updateSubscriptionStatus(OneSignal);
        };
      } else {
        statusText.textContent = "Stato attuale: Non iscritto";
        btn.textContent = "Attiva Notifiche / Richiedi Consenso";
        btn.onclick = async () => {
          if (OneSignal.User.PushSubscription.id) {
            await OneSignal.User.PushSubscription.optIn();
          } else {
            await OneSignal.Slidedown.promptPush();
          }
          updateSubscriptionStatus(OneSignal);
        };
      }
    }
  </script>

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f4f4f9;
    }
    .card {
      background: white;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      max-width: 420px;
      text-align: center;
    }
    .header-title {
      font-size: 1.6rem;
      font-weight: 700;
      color: #1a1a1a;
      margin: 0;
    }
    .header-subtitle {
      font-size: 1.2rem;
      font-weight: 500;
      color: #4a5568;
      margin: 0.25rem 0 0 0;
    }
    .header-number {
      font-size: 2.5rem;
      font-weight: 800;
      color: #e54b4d;
      margin: 0.5rem 0 1.5rem 0;
    }
    p {
      color: #666;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .status {
      margin: 1.5rem 0;
      font-weight: 600;
      color: #333;
    }
    button {
      background-color: #e54b4d;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    button:hover {
      background-color: #c93b3d;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header-title">Comune di Toffia</div>
    <div class="header-subtitle">Centro Notifiche</div>
    <div class="header-number">01</div>

    <p>Gestisci le tue preferenze per la ricezione delle comunicazioni istituzionali in tempo reale.</p>
    
    <div id="status-text" class="status">Verifica stato...</div>
    
    <button id="prompt-button">Caricamento...</button>
  </div>

</body>
</html>
